services:
  - type: web
    name: pakistan-air-quality
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REFRESH_MINUTES      
        value: "15"
      - key: HISTORY_DAYS         
        value: "90"
